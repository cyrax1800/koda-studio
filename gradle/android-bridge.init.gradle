// Android Bridge init script. Passed with --init-script by android-bridge-sync during the model build only.
//
// Registers the tooling model "androidbridge.sync.AndroidBridgeExtras" in every project. For the requested
// variant it reports what Android Studio's v2 models leave out:
//   * the external compile classpath as the compiler sees it ("android-classes-jar", which includes AAR R classes),
//   * project dependencies,
//   * Kotlin compiler options and compiler plugins,
//   * which source-generation tasks exist.
// Plain JVM projects (java / kotlin-jvm) get their source sets and classpaths from here as well.
//
// Everything is duck-typed so that neither AGP nor KGP needs to be on this script's classpath.

import groovy.json.JsonOutput
import org.gradle.api.Plugin
import org.gradle.api.Project
import org.gradle.api.artifacts.Configuration
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.attributes.Attribute
import org.gradle.tooling.provider.model.ParameterizedToolingModelBuilder
import org.gradle.tooling.provider.model.ToolingModelBuilderRegistry

import javax.inject.Inject

interface AndroidBridgeExtrasParameter {
    String getVariant()
    void setVariant(String variant)
}

class AndroidBridgeExtrasModel implements Serializable {
    private final String json

    AndroidBridgeExtrasModel(String json) { this.json = json }

    String getJson() { json }
}

class AndroidBridgeExtrasBuilder implements ParameterizedToolingModelBuilder<AndroidBridgeExtrasParameter> {
    static final String MODEL_NAME = 'androidbridge.sync.AndroidBridgeExtras'
    static final Attribute<String> ARTIFACT_TYPE = Attribute.of('artifactType', String)
    static final List<String> ANDROID_PLUGINS = [
        'com.android.application', 'com.android.library', 'com.android.dynamic-feature', 'com.android.test',
    ]
    static final List<String> GENERATION_TASKS = [
        'generate%sBuildConfig', 'generate%sRFile', 'process%sResources', 'dataBindingGenBaseClasses%s',
        'compile%sAidl', 'generate%sSources', 'ksp%sKotlin', 'kapt%sKotlin',
    ]

    boolean canBuild(String modelName) { modelName == MODEL_NAME }

    Class<AndroidBridgeExtrasParameter> getParameterType() { AndroidBridgeExtrasParameter }

    Object buildAll(String modelName, Project project) { build(project, null) }

    Object buildAll(String modelName, AndroidBridgeExtrasParameter parameter, Project project) {
        build(project, parameter?.variant)
    }

    private static Object build(Project project, String variant) {
        def problems = []
        def result = [projectPath: project.path, problems: problems]
        try {
            // Defaults to the Kotlin Gradle plugin version; used when no explicit languageVersion is configured.
            result.kotlinPluginVersion = safe { project.extensions.findByName('kotlin')?.coreLibrariesVersion }
            if (ANDROID_PLUGINS.any { project.pluginManager.hasPlugin(it) }) {
                result.kind = 'android'
                if (variant != null) buildAndroid(project, variant, result, problems)
            } else if (project.extensions.findByName('sourceSets') != null) {
                result.kind = 'jvm'
                buildJvm(project, result, problems)
            } else {
                result.kind = 'other'
            }
        } catch (Throwable t) {
            problems << describe('extras', t)
        }
        new AndroidBridgeExtrasModel(JsonOutput.toJson(result))
    }

    private static void buildAndroid(Project project, String variant, Map result, List problems) {
        String v = capitalize(variant)
        result.variant = variant
        def components = [:]
        [main: '', unitTest: 'UnitTest', androidTest: 'AndroidTest'].each { kind, suffix ->
            Configuration configuration = project.configurations.findByName("${variant}${suffix}CompileClasspath")
            if (configuration == null) return
            def component = [:]
            component.configuration = configuration.name
            component.libraries = externalLibraries(configuration, ['android-classes-jar', 'jar'], problems)
            component.projectDependencies = projectDependencies(configuration, project, problems)
            component.kotlin = kotlinOptions(project, "compile${v}${suffix}Kotlin", problems)
            components[kind] = component
        }
        result.components = components
        def names = project.tasks.names
        result.tasks = GENERATION_TASKS.collect { String.format(it, v) }.findAll { names.contains(it) }
    }

    private static void buildJvm(Project project, Map result, List problems) {
        def sourceSets = project.extensions.getByName('sourceSets')
        def kotlinExtension = project.extensions.findByName('kotlin')
        def components = [:]
        [main: 'main', test: 'test'].each { kind, name ->
            def sourceSet = sourceSets.findByName(name)
            if (sourceSet == null) return
            def component = [:]
            component.javaDirs = paths(sourceSet.java.srcDirs)
            component.resourceDirs = paths(sourceSet.resources.srcDirs)
            component.generatedDirs = paths(safe { sourceSet.output.generatedSourcesDirs.files } ?: [])
            def kotlinSourceSet = safe { kotlinExtension?.sourceSets?.findByName(name) }
            component.kotlinDirs = paths(safe { kotlinSourceSet?.kotlin?.srcDirs } ?: [])
            component.outputDirs = paths(safe { sourceSet.output.classesDirs.files } ?: [])
            Configuration configuration = project.configurations.findByName(sourceSet.compileClasspathConfigurationName)
            if (configuration != null) {
                component.configuration = configuration.name
                component.libraries = externalLibraries(configuration, ['jar'], problems)
                component.projectDependencies = projectDependencies(configuration, project, problems)
            }
            component.kotlin = kotlinOptions(project, name == 'main' ? 'compileKotlin' : "compile${capitalize(name)}Kotlin", problems)
            component.javaRelease = safe {
                def task = project.tasks.findByName(sourceSet.compileJavaTaskName)
                task?.options?.release?.orNull?.toString() ?: task?.targetCompatibility
            }
            components[kind] = component
        }
        result.components = components
    }

    /** External (non-project) artifacts of a compile classpath, using the first artifact type that resolves. */
    private static List externalLibraries(Configuration configuration, List<String> artifactTypes, List problems) {
        def byComponent = new LinkedHashMap<String, Map>()
        boolean complete = false
        for (String artifactType : artifactTypes) {
            // Later artifact types are only a fallback; skip them when the preferred one resolved everything.
            if (complete) break
            try {
                def view = configuration.incoming.artifactView { view ->
                    view.lenient = true
                    view.componentFilter { id -> !(id instanceof ProjectComponentIdentifier) }
                    view.attributes { attributes -> attributes.attribute(ARTIFACT_TYPE, artifactType) }
                }
                view.artifacts.artifacts.each { artifact ->
                    def id = artifact.id.componentIdentifier
                    String key = id instanceof ModuleComponentIdentifier ? "${id.group}:${id.module}:${id.version}" : id.displayName
                    def entry = byComponent.get(key)
                    if (entry == null) {
                        entry = [id: key, files: [], artifactType: artifactType]
                        if (id instanceof ModuleComponentIdentifier) {
                            entry.group = id.group
                            entry.module = id.module
                            entry.version = id.version
                        }
                        byComponent.put(key, entry)
                    }
                    if (entry.artifactType == artifactType && !entry.files.contains(artifact.file.absolutePath)) {
                        entry.files << artifact.file.absolutePath
                    }
                }
                def failures = view.artifacts.failures
                complete = failures.isEmpty() && !byComponent.isEmpty()
                if (artifactType == artifactTypes.last()) {
                    failures.each { failure -> problems << describe("resolve ${configuration.name} (${artifactType})", failure) }
                }
            } catch (Throwable t) {
                problems << describe("resolve ${configuration.name} (${artifactType})", t)
            }
        }
        new ArrayList(byComponent.values())
    }

    private static List projectDependencies(Configuration configuration, Project project, List problems) {
        try {
            return configuration.incoming.resolutionResult.allComponents
                .collect { it.id }
                .findAll { it instanceof ProjectComponentIdentifier && it.projectPath != project.path }
                .collect { [path: it.projectPath, build: safe { it.build.buildPath } ?: ':'] }
                .unique()
        } catch (Throwable t) {
            problems << describe("project dependencies of ${configuration.name}", t)
            return []
        }
    }

    private static Map kotlinOptions(Project project, String taskName, List problems) {
        if (!project.tasks.names.contains(taskName)) return null
        try {
            def task = project.tasks.getByName(taskName)
            def options = task.compilerOptions
            def result = [task: taskName]
            result.jvmTarget = safe { options.jvmTarget.orNull?.target }
            result.languageVersion = safe { options.languageVersion.orNull?.version }
            result.apiVersion = safe { options.apiVersion.orNull?.version }
            result.freeCompilerArgs = safe { options.freeCompilerArgs.get() } ?: []
            result.optIn = safe { options.optIn.get() } ?: []
            result.pluginClasspath = paths(safe { task.pluginClasspath.files } ?: [])
            result.pluginOptions = safe {
                task.pluginOptions.get().collectMany { config ->
                    config.allOptions().collectMany { pluginId, options2 ->
                        options2.collect { option -> "plugin:${pluginId}:${option.key}=${option.value}".toString() }
                    }
                }
            } ?: []
            return result
        } catch (Throwable t) {
            problems << describe("kotlin options of ${taskName}", t)
            return null
        }
    }

    private static List<String> paths(Collection<File> files) {
        files.collect { it.absolutePath }
    }

    private static String capitalize(String name) {
        name ? name.substring(0, 1).toUpperCase(Locale.ROOT) + name.substring(1) : name
    }

    private static Object safe(Closure closure) {
        try {
            return closure.call()
        } catch (Throwable ignored) {
            return null
        }
    }

    private static Map describe(String stage, Throwable t) {
        def messages = []
        for (Throwable c = t; c != null && messages.size() < 6; c = c.cause) messages << "${c.class.simpleName}: ${c.message}"
        [stage: stage, message: messages.join(' <- ').take(2000)]
    }
}

class AndroidBridgePlugin implements Plugin<Project> {
    private final ToolingModelBuilderRegistry registry

    @Inject
    AndroidBridgePlugin(ToolingModelBuilderRegistry registry) {
        this.registry = registry
    }

    void apply(Project project) {
        registry.register(new AndroidBridgeExtrasBuilder())
    }
}

allprojects { project ->
    project.pluginManager.apply(AndroidBridgePlugin)
}
